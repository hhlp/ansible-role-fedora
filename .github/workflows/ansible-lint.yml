---
name: Ansible quality

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml -p .ansible/collections

      - name: YAML lint
        run: yamllint .

      - name: Ansible lint
        run: ansible-lint

      - name: Syntax check
        run: ansible-playbook --syntax-check site.yml
