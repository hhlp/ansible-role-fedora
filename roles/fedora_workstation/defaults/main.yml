# Extra extensions may be added without modifying the preserved profile catalog.
fedora_workstation_vscode_extra_extensions: []

# Compatibility list: values supplied here are also merged into the requested set.
fedora_workstation_vscode_extensions: []

# Duplicate entries found in the original source list, retained for audit only.
fedora_workstation_vscode_duplicate_extensions:
  - ms-vscode-remote.remote-containers
  - dsznajder.es7-react-js-snippets
  - ms-python.python
  - ms-vscode.cpptools-extension-pack
  - ms-vscode.cmake-tools
  - GitHub.copilot-labs
# NVIDIA is opt-in and assumes RPM Fusion has been enabled.
fedora_workstation_nvidia_packages:
  - akmod-nvidia
  - xorg-x11-drv-nvidia-cuda

# AI command-line tools. They are intentionally optional and installed through npm.
fedora_workstation_ai_npm_packages:
  - "@anthropic-ai/claude-code"
  - "@google/gemini-cli"
