---
- name: Install Git and uv for Spec Kit
  ansible.builtin.dnf5:
    name:
      - git
      - uv
    state: present

- name: Set up Spec Kit for the workstation user
  become: true
  become_user: "{{ fedora_workstation_user }}"
  environment:
    HOME: "{{ fedora_workstation_home }}"
    UV_TOOL_BIN_DIR: "{{ fedora_workstation_home }}/.local/bin"
  block:
    - name: Install Specify CLI from GitHub
      ansible.builtin.command:
        argv:
          - /usr/bin/uv
          - tool
          - install
          - specify-cli
          - --from
          - git+https://github.com/github/spec-kit.git
        creates: "{{ fedora_workstation_home }}/.local/bin/specify"

    - name: Verify Specify CLI runs
      ansible.builtin.command:
        argv:
          - "{{ fedora_workstation_home }}/.local/bin/specify"
          - version
      changed_when: false
      when: not ansible_check_mode
